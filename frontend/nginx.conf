server {
  listen 80;
  client_max_body_size 650m;  # station photos, 360° panoramas and zipped virtual tours
  root /usr/share/nginx/html;
  location /api/    { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /static/ { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
