server {
  listen 80;
  client_max_body_size 2100m;  # station photos, 360° panoramas and zipped virtual tours (up to 2 GB)
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
    proxy_request_buffering off;  # big tour archives go straight to the backend instead of a temp file here
    proxy_read_timeout 600s; proxy_send_timeout 600s;  # unpacking a large tour takes minutes
  }
  location /static/ { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
